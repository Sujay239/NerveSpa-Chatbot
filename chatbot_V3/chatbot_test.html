<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot Webhook Tester</title>
    <style>
      body {
        font-family: sans-serif;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .chat-container {
        width: 450px;
        height: 600px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-header {
        background: #0176d3;
        color: #fff;
        padding: 15px;
        text-align: center;
        font-weight: bold;
        font-size: 1.1em;
      }
      .chat-messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 15px;
        background: #fafafa;
      }
      .message {
        max-width: 85%;
        padding: 12px 16px;
        border-radius: 18px;
        line-height: 1.4;
        word-wrap: break-word;
        font-size: 15px;
      }
      .message.bot {
        background: #eef1f6;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        color: #333;
      }
      .message.user {
        background: #0176d3;
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
      }
      .chat-input {
        display: flex;
        padding: 15px;
        border-top: 1px solid #ddd;
        background: #fff;
      }
      .chat-input input {
        flex: 1;
        padding: 12px 15px;
        border: 1px solid #ccc;
        border-radius: 20px;
        outline: none;
        font-size: 15px;
      }
      .chat-input button {
        background: #0176d3;
        color: white;
        border: none;
        padding: 10px 20px;
        margin-left: 10px;
        border-radius: 20px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
      }
      .chat-input button:hover {
        background: #005fb2;
      }
      .loading {
        font-size: 12px;
        color: #888;
        margin-left: 20px;
        margin-bottom: 10px;
        display: none;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">Webhook Tester</div>
      <div class="chat-messages" id="chat-messages">
        <div class="message bot">Hello! I am ready to test your webhook.</div>
      </div>
      <div class="loading" id="loading">Waiting for response...</div>
      <div class="chat-input" id="chat-form">
        <input
          type="text"
          id="user-input"
          placeholder="Type a message..."
          autocomplete="off"
        />
        <button id="send-btn">Send</button>
      </div>
    </div>

    <script>
      const messagesContainer = document.getElementById("chat-messages");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const loading = document.getElementById("loading");

      // The webhook URL
      const webhookUrl = "https://n8n.srv917960.hstgr.cloud/webhook/nervespa-chatbot";
      
      // Generate a simple session ID when the page loads
      const sessionId = Math.random().toString(36).substring(2, 15);

      function addMessage(text, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        msgDiv.textContent = text;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // Add user message to UI
        addMessage(text, "user");
        userInput.value = "";

        // Show loading indicator
        loading.style.display = "block";
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
          // Construct the exact URL requested by the user
          const url = `${webhookUrl}?chatInput=${encodeURIComponent(
            text
          )}&sessionId=${sessionId}`;

          const response = await fetch(url, {
            method: "GET",
            // To avoid CORS issues if they happen on local testing, we might need a proxy. But let's try direct first.
            headers: {
              Accept: "application/json",
            },
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const data = await response.json();

          // Log the raw data in console for debugging
          console.log("Received data from n8n:", data);

          // Handle the format: [{"output": "..."}]
          if (Array.isArray(data) && data.length > 0 && data[0].output) {
            addMessage(data[0].output, "bot");
          } else if (data && data.text) {
            // Keep the fallback for the original format just in case
            addMessage(data.text, "bot");
          } else {
            addMessage(
              `Response format unexpected. Raw response: ${JSON.stringify(data)}`,
              "bot",
            );
          }
        } catch (error) {
          console.error("Error fetching from webhook:", error);
          addMessage(
            `Error: Could not connect to the webhook. Check console. (${error.message})`,
            "bot",
          );
        } finally {
          // Hide loading indicator
          loading.style.display = "none";
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      userInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
